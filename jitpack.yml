jdk:
  - openjdk17

# Cloudy là KMP. JitPack chạy trên Linux (không có Xcode) nên chỉ publish
# metadata KMP + Android variant. RELEASE_SIGNING_ENABLED=false để bỏ qua
# GPG signing (chỉ cần khi publish lên Maven Central).
install:
  - ./gradlew
      :cloudy:publishKotlinMultiplatformPublicationToMavenLocal
      :cloudy:publishAndroidReleasePublicationToMavenLocal
      -PRELEASE_SIGNING_ENABLED=false
      -x test
      --no-daemon
